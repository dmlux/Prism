[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vexo"
version = "0.1.0"
description = "Training and experimentation tools for Vexo NLP models"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5,<3",
    "torch>=2.13,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]