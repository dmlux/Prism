[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-nlp"
version = "0.1.0"
description = "Training and experimentation tools for Prism NLP models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5,<3",
    "torch>=2.13,<3",
    "transformers>=5.13,<5.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]
