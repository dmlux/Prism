# Builds the JNI native library on every supported platform and assembles
# the self-contained Java JAR (embedded natives, extracted at runtime by
# PrismTagger — see docs/INTEGRATION.md).
#
# Triggers: manually via workflow_dispatch, or by pushing a tag like
# `v0.2.0` (the shared library-release tag family for the Swift, C++,
# C, and Java bindings). Tag runs additionally attach the assembled JAR to
# the GitHub release of that tag.
#
# Compiler-cache scoping: GitHub shares caches only within the ref that
# saved them plus the default branch, so caches saved by tag runs are
# invisible to later tags. The release runbook therefore dispatches this
# workflow on main before tagging — that run saves the cache in main
# scope, and the tag run restores it warm.
#
# Notes for the first runs:
# - The C++ build fetches the pinned ExecuTorch sources at configure time
#   and resolves torch headers through the Python interpreter; torch is
#   pinned to the same range as python/pyproject.toml.
# - The test suites skip model-dependent tests cleanly when no local
#   artifact is present, so ctest passes without downloading a model.
# - Windows is included as an experimental leg (continue-on-error): the
#   C++ code is written portably, but this pipeline has not yet been
#   exercised on MSVC.

name: java-natives
# Run titles name the deliverable and the ref instead of the triggering
# commit message — several workflows share one tag push, and identical
# commit titles made runs indistinguishable in the Actions list.
run-name: "Java all-platforms JAR · ${{ github.ref_name }}"

# Attaching the assembled JAR to a release needs write access to
# repository contents; everything else works with the read-only default.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-native:
    # The experimental suffix explains the expected red icon: the leg is
    # continue-on-error and does not gate the run or the JAR.
    name: "JNI native (${{ matrix.classifier }})${{ matrix.experimental && ' · experimental, may fail' || '' }}"
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            classifier: macos-aarch64
            library: libprism_jni.dylib
            experimental: false
          # GitHub retired the Intel macOS runners; the x86_64 library is
          # cross-compiled on the arm64 runner instead. Tests are skipped
          # on this leg (the host cannot reliably execute the foreign
          # architecture), which is covered by the native macOS leg.
          - runner: macos-14
            classifier: macos-x86_64
            library: libprism_jni.dylib
            cmake_flags: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_SYSTEM_NAME=Darwin -DCMAKE_SYSTEM_PROCESSOR=x86_64
            run_tests: false
            experimental: false
          - runner: ubuntu-24.04
            classifier: linux-x86_64
            library: libprism_jni.so
            experimental: false
          - runner: ubuntu-24.04-arm
            classifier: linux-aarch64
            library: libprism_jni.so
            experimental: false
          - runner: windows-2022
            classifier: windows-x86_64
            library: prism_jni.dll
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install torch (ExecuTorch build-time dependency)
        run: python -m pip install "torch>=2.12,<2.13" pyyaml
        shell: bash

      # Compiler cache: the ExecuTorch build dominates the runtime of a
      # cold leg (~30 minutes); with a warm ccache it drops to minutes.
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ccache
      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache
      - name: Restore compiler cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.classifier }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.classifier }}-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1.5G
        run: |
          launcher=""
          if command -v ccache > /dev/null; then
            launcher="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -S cpp -B cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            $launcher ${{ matrix.cmake_flags }}
        shell: bash

      - name: Build
        # Bounded parallelism: hosted runners have 7-16 GB of RAM, and the
        # Eigen BLAS translation units inside ExecuTorch OOM-kill the
        # compiler when every core builds one simultaneously.
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1.5G
        run: |
          cmake --build cpp/build --parallel 2 --config Release
          command -v ccache > /dev/null && ccache --show-stats || true
        shell: bash

      - name: Test (model-dependent tests skip without a local artifact)
        if: ${{ matrix.run_tests != false }}
        run: ctest --test-dir cpp/build --output-on-failure --build-config Release
        shell: bash

      - name: Stage native library
        run: |
          mkdir -p staged/${{ matrix.classifier }}
          # Single-config generators place the library in cpp/build, the
          # Visual Studio multi-config generator in cpp/build/Release.
          if [ -f "cpp/build/${{ matrix.library }}" ]; then
            cp "cpp/build/${{ matrix.library }}" staged/${{ matrix.classifier }}/
          else
            cp "cpp/build/Release/${{ matrix.library }}" staged/${{ matrix.classifier }}/
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.classifier }}
          path: staged/${{ matrix.classifier }}/${{ matrix.library }}
          if-no-files-found: error

  assemble-jar:
    name: assemble self-contained JAR
    # Runs when the required platform legs succeed; the experimental
    # Windows leg reports success even on failure (continue-on-error),
    # so a missing Windows library never blocks the JAR — it is simply
    # not embedded.
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Collect natives into the Maven resource layout
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives

      - name: Place natives
        run: |
          base=java/src/main/resources/io/github/dmlux/prism/native
          mkdir -p "$base"
          for dir in natives/native-*; do
            classifier="${dir#natives/native-}"
            mkdir -p "$base/$classifier"
            cp "$dir"/* "$base/$classifier/"
          done
          find "$base" -type f -exec ls -la {} \;

      - name: Package
        run: mvn -q -f java/pom.xml -DskipTests package

      - name: Rename with platform summary
        run: |
          version=$(mvn -q -f java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          cp "java/target/prism-${version}.jar" "prism-${version}-all-platforms.jar"
          echo "JAR_NAME=prism-${version}-all-platforms.jar" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: prism-jar-embedded-natives
          path: ${{ env.JAR_NAME }}
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${JAR_NAME}" --clobber
