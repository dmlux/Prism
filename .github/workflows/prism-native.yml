# Builds PrismNative.xcframework — the Apple binary distribution of the
# stable Prism C ABI (see docs/INTEGRATION.md, "PrismNative") — and validates
# it against a real third-party consumer.
#
# This is a REUSABLE workflow (workflow_call) driven by release.yml, plus a
# workflow_dispatch entry for ad-hoc builds. It no longer runs on tag pushes
# and no longer attaches anything to a release: release.yml builds once and
# attaches the exact bytes it built (see docs/RELEASING.md). The assembled
# XCFramework and its SwiftPM checksum are exposed as a workflow artifact and
# as the `xcframework_checksum` output.
#
# Structure: one matrix job per platform slice, then one assembly job.
# A single serial job cannot work: every slice is a full ExecuTorch
# source build (~1-2 h on the 3-core macOS runner), and five of them
# exceed GitHub's hard six-hour job limit.
#
# Notes:
# - Each slice build fetches the pinned ExecuTorch sources at configure
#   time and resolves torch headers through a Python interpreter, exactly
#   like the local CMake build. ExecuTorch's oplist codegen imports yaml.
# - iOS slices cross-compile through ExecuTorch's vendored
#   ios.toolchain.cmake, which lives inside a fetched ExecuTorch checkout;
#   a configure-only host run materializes it first.
# - The consumer test downloads a released fast model artifact, so the
#   run proves end-to-end inference including XNNPACK and quantized-kernel
#   registration without any host linker flags.

name: prism-native
run-name: "PrismNative XCFramework · ${{ github.ref_name }}"

# Only reads the repository and downloads a public model release for the
# consumer test; release.yml owns the write side (commit, tag, attach).
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      consumer_model:
        description: "Model release tag the consumer test downloads (e.g. prism-no-0.2.4)"
        type: string
        default: "prism-no-0.2.4"
    outputs:
      xcframework_checksum:
        description: "SwiftPM checksum of the assembled PrismNative.xcframework.zip"
        value: ${{ jobs.xcframework.outputs.checksum }}
  workflow_dispatch:
    inputs:
      consumer_model:
        description: "Model release tag the consumer test downloads (e.g. prism-no-0.2.4)"
        type: string
        default: "prism-no-0.2.4"

jobs:
  slice:
    name: slice ${{ matrix.slice }}
    runs-on: macos-14
    strategy:
      fail-fast: true
      matrix:
        slice:
          - macos-arm64
          - macos-x86_64
          - ios-arm64
          - ios-simulator-arm64
          - ios-simulator-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install torch and pyyaml for the ExecuTorch build
        run: python -m pip install "torch>=2.9,<3" pyyaml

      # Compiler cache. GitHub scopes caches to the ref that saved them
      # (plus the default branch). release.yml runs this workflow from main,
      # so slices restore and save the cache in main scope across releases.
      - name: Install ccache
        run: brew install ccache
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-prism-native-${{ matrix.slice }}-${{ github.sha }}
          restore-keys: |
            ccache-prism-native-${{ matrix.slice }}-

      - name: Materialize the iOS CMake toolchain (configure-only host run)
        if: startsWith(matrix.slice, 'ios-')
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          test -f cpp/build/_deps/executorch/third-party/ios-cmake/ios.toolchain.cmake

      - name: Build the slice library
        env:
          # CMake picks the launcher up from the environment at configure
          # time; the build script needs no cache-specific flags.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1.5G
          # Hosted macOS runners have 3 cores and a tight process limit;
          # the ccache wrapper doubles processes per compile job.
          PRISM_NATIVE_JOBS: 3
        run: |
          scripts/build-prism-native.sh --slices ${{ matrix.slice }} --skip-assemble
          ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: prism-native-slice-${{ matrix.slice }}
          path: build/prism-native/${{ matrix.slice }}/libPrismNative.dylib
          if-no-files-found: error

  xcframework:
    name: PrismNative.xcframework
    needs: slice
    runs-on: macos-14
    outputs:
      checksum: ${{ steps.checksum.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: prism-native-slice-*
          path: build/prism-native/slices

      - name: Arrange slice libraries for assembly
        run: |
          for directory in build/prism-native/slices/prism-native-slice-*; do
            slice="${directory#*prism-native-slice-}"
            mkdir -p "build/prism-native/$slice"
            mv "$directory/libPrismNative.dylib" "build/prism-native/$slice/"
          done

      - name: Assemble, validate, and zip the XCFramework
        run: |
          scripts/build-prism-native.sh --assemble-only --slices \
            macos-arm64,macos-x86_64,ios-arm64,ios-simulator-arm64,ios-simulator-x86_64

      - name: Download the fast model artifact for the consumer test
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_MODEL: ${{ inputs.consumer_model }}
        run: |
          gh release download "$CONSUMER_MODEL" \
            --pattern "${CONSUMER_MODEL}-fast.tar.gz" --dir /tmp
          mkdir -p models
          tar -xzf "/tmp/${CONSUMER_MODEL}-fast.tar.gz" -C models/

      - name: Run the third-party consumer test (no manual linker flags)
        env:
          CONSUMER_MODEL: ${{ inputs.consumer_model }}
        run: |
          cd examples/prism-native-consumer
          PRISM_NATIVE_XCFRAMEWORK_PATH="$GITHUB_WORKSPACE/build/prism-native/PrismNative.xcframework" \
            swift run consumer "$GITHUB_WORKSPACE/models/${CONSUMER_MODEL}-fast"

      - name: Record the SwiftPM checksum
        id: checksum
        run: |
          value=$(swift package compute-checksum build/prism-native/PrismNative.xcframework.zip)
          echo "$value" | tee build/prism-native/PrismNative.xcframework.zip.checksum
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PrismNative.xcframework
          path: |
            build/prism-native/PrismNative.xcframework.zip
            build/prism-native/PrismNative.xcframework.zip.checksum
          if-no-files-found: error
