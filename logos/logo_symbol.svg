  <title id="title">Vexo symbol</title>
  <desc id="desc">The cyan-to-violet Vexo symbol without a wordmark, centered on a transparent square canvas.</desc>

  <defs>
    <linearGradient id="symbol-gradient" x1="248" y1="384" x2="774" y2="718" gradientUnits="userSpaceOnUse">
