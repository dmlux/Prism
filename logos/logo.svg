             C453 997 465 992 475 982
             L490 997
             C478 1010 460 1018 437 1018
             C397 1018 370 996 370 956
             C370 919 396 894 436 894
             C472 894 494 916 496 948
             Z
             M394 952
             L471 939
             C468 923 455 914 435 914
             C412 914 397 929 394 952
             Z"/>

    <path d="M514 897 L543 897 L577 938 L611 897 L638 897 L592 953 L645 1016 L616 1016 L577 969 L538 1016 L510 1016 L562 953 Z"/>

    <path d="M723 894
