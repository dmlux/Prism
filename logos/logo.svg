<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Prism NLP logo</title>
  <desc id="desc">Seven translucent rainbow triangles overlap in a circular prism rosette above a geometric Prism wordmark, on a transparent background.</desc>

  <defs>
    <g id="prism-rosette" style="isolation:isolate">
      <path d="M512 126 L718 718 L306 718 Z" fill="#FF3B4E" fill-opacity=".54" style="mix-blend-mode:screen"/>
      <path d="M512 126 L718 718 L306 718 Z" fill="#FF7A21" fill-opacity=".54" style="mix-blend-mode:screen" transform="rotate(51.4286 512 512)"/>
      <path d="M512 126 L718 718 L306 718 Z" fill="#FFD21F" fill-opacity=".54" style="mix-blend-mode:screen" transform="rotate(102.8571 512 512)"/>
      <path d="M512 126 L718 718 L306 718 Z" fill="#31C967" fill-opacity=".54" style="mix-blend-mode:screen" transform="rotate(154.2857 512 512)"/>
      <path d="M512 126 L718 718 L306 718 Z" fill="#16C7D9" fill-opacity=".54" style="mix-blend-mode:screen" transform="rotate(205.7143 512 512)"/>
      <path d="M512 126 L718 718 L306 718 Z" fill="#3478F6" fill-opacity=".54" style="mix-blend-mode:screen" transform="rotate(257.1429 512 512)"/>
      <path d="M512 126 L718 718 L306 718 Z" fill="#8A4DFF" fill-opacity=".54" style="mix-blend-mode:screen" transform="rotate(308.5714 512 512)"/>
    </g>
  </defs>

  <!-- Transparent canvas: intentionally no background rectangle. -->
  <use href="#prism-rosette" transform="translate(164 30) scale(.68)"/>

  <!-- Custom geometric PRISM wordmark; all glyphs are vectors, not font text. -->
  <g fill="none" stroke="#24233D" stroke-width="15" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M209 851 V746 H256 C284 746 299 759 299 779 C299 800 284 813 256 813 H209"/>
    <path d="M360 851 V746 H407 C435 746 450 759 450 779 C450 800 435 813 407 813 H360"/>
    <path d="M413 813 L456 851"/>
    <path d="M517 739 V859"/>
    <path d="M677 760 C665 751 648 746 629 746 C603 746 587 757 587 774 C587 791 604 797 631 801 C659 805 675 811 675 828 C675 843 658 851 631 851 C610 851 591 846 578 835"/>
    <path d="M738 857 V759 L778 819 L818 759 V857"/>
  </g>
</svg>
