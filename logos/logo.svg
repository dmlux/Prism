<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Vexo logo</title>
  <desc id="desc">A cyan-to-violet Vexo symbol above a blue-violet lowercase vexo wordmark, on a transparent background.</desc>

  <defs>
    <linearGradient id="symbol-gradient" x1="248" y1="384" x2="774" y2="718" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28d9ff"/>
      <stop offset="0.34" stop-color="#269dff"/>
      <stop offset="0.69" stop-color="#5142ff"/>
      <stop offset="1" stop-color="#a847ff"/>
    </linearGradient>

    <linearGradient id="left-gradient" x1="276" y1="384" x2="550" y2="808" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25d9ff"/>
      <stop offset="0.48" stop-color="#287dff"/>
      <stop offset="1" stop-color="#6439ff"/>
    </linearGradient>

    <linearGradient id="right-gradient" x1="775" y1="385" x2="578" y2="718" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a84aff"/>
      <stop offset="0.52" stop-color="#663dff"/>
      <stop offset="1" stop-color="#3f42e8"/>
    </linearGradient>

    <linearGradient id="word-gradient" x1="220" y1="956" x2="788" y2="956" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4863e7"/>
      <stop offset="0.52" stop-color="#525be3"/>
      <stop offset="1" stop-color="#5e53e0"/>
    </linearGradient>

  </defs>

  <!-- Square logo lockup with a generous, platform-friendly safe area. -->
  <g transform="translate(-92.8 -329.2) scale(1.2)">
