             C252 384 247 388 249 395
             C250 398 252 401 254 404
             L496 790
             C503 801 513 808 526 809
             C538 810 548 804 554 794
             L577 758
             C581 751 581 745 577 738
             L376 411
             C365 393 350 384 329 384
             Z"/>
    <path fill="url(#right-gradient)"
          d="M747 384
             C728 384 712 394 702 412
             L560 660
             C557 666 557 672 560 678
             L582 713
             C585 718 590 720 595 718
             C598 717 601 714 603 710
             L773 398
             C777 391 772 385 765 384
             Z"/>
  </g>

  <!-- Linguistic-analysis lines inside the V. -->
  <g fill="url(#symbol-gradient)">
    <rect x="422" y="412" width="114" height="16" rx="8"/>
    <rect x="445" y="453" width="190" height="16" rx="8"/>
    <rect x="469" y="494" width="140" height="16" rx="8"/>
    <rect x="494" y="536" width="89" height="16" rx="8"/>
    <rect x="517" y="578" width="48" height="15" rx="7.5"/>
    <rect x="535" y="619" width="20" height="15" rx="7.5"/>
  </g>

  <!-- Lowercase vexo wordmark. All glyphs are paths; no font dependency. -->
  <g fill="url(#word-gradient)" fill-rule="evenodd">
    <path d="M220 897 L245 897 L286.5 990 L330 897 L354 897 L298 1016 L278 1016 Z"/>

    <path d="M496 952
